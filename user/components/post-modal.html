<!-- TaskNOVA reusable Post Modal
     Location: /user/components/post-modal.html
-->
<style>
#tnPostModal{
  --pm-surface-solid:#fff;--pm-text:#102033;--pm-text-soft:#64748b;
  --pm-line:rgba(15,78,117,.14);--pm-primary:#0f4e75;
  position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:20px;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s ease,visibility 0s linear .28s
}
#tnPostModal.pm-open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .28s ease}
body.dark #tnPostModal{
  --pm-surface-solid:#091321;--pm-text:#f5f9ff;--pm-text-soft:#9aaac0;
  --pm-line:rgba(153,190,230,.12);--pm-primary:#1680ff
}
#tnPostModal .pm-backdrop{position:absolute;inset:0;background:rgba(2,8,18,.52);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);opacity:0;transition:opacity .3s ease}
#tnPostModal.pm-open .pm-backdrop{opacity:1}
#tnPostModal .pm-panel{
  position:relative;z-index:1;width:min(620px,100%);max-height:calc(100svh - 40px);overflow:auto;
  padding:28px;border:1px solid var(--pm-line);border-radius:24px;
  background:radial-gradient(circle at 10% 0%,rgba(22,128,255,.08),transparent 42%),
             radial-gradient(circle at 100% 100%,rgba(25,215,241,.06),transparent 40%),var(--pm-surface-solid);
  color:var(--pm-text);box-shadow:0 30px 90px rgba(0,0,0,.25);
  transform:translateY(24px) scale(.96);opacity:0;
  transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .25s ease
}
#tnPostModal.pm-open .pm-panel{transform:translateY(0) scale(1);opacity:1}
#tnPostModal .pm-close{
  position:absolute;top:14px;right:14px;width:38px;height:38px;display:grid;place-items:center;
  border:1px solid var(--pm-line);border-radius:12px;background:rgba(128,128,128,.08);
  color:var(--pm-text);cursor:pointer;font-size:1.25rem;line-height:1;
  transition:transform .22s ease,background .22s ease,border-color .22s ease
}
#tnPostModal .pm-close:hover{transform:scale(1.04);border-color:rgba(22,128,255,.35);background:rgba(22,128,255,.1)}
#tnPostModal .pm-header{padding-right:44px;margin-bottom:22px}
#tnPostModal .pm-header h2{margin:0;font-size:clamp(1.25rem,3vw,1.55rem);line-height:1.25;letter-spacing:-.025em}
#tnPostModal .pm-header p{margin:7px 0 0;color:var(--pm-text-soft);font-size:.82rem;line-height:1.55}
#tnPostModal .pm-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#tnPostModal .pm-option{
  position:relative;display:flex;flex-direction:column;min-width:0;min-height:220px;padding:22px 20px 20px;
  border:1px solid var(--pm-line);border-radius:20px;background:var(--pm-surface-solid);
  color:inherit;text-decoration:none;overflow:hidden;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .28s ease,box-shadow .28s ease
}
#tnPostModal .pm-option:hover{transform:translateY(-5px);border-color:rgba(22,128,255,.35);box-shadow:0 18px 45px rgba(15,78,117,.12)}
#tnPostModal .pm-option:active{transform:translateY(-1px) scale(.985)}
/* ---------- CARD ICON ---------- */
#tnPostModal .pm-icon {
  width: 55px;
  height: 55px;
  min-width: 55px;
  min-height: 55px;

  display: grid !important;
  place-items: center !important;

  margin: 0 0 28px 0;

  border: none;
  border-radius: 17px;

  color: #fff !important;
  background: linear-gradient(135deg, #0067ff, #13cde5);

  box-shadow: 0 12px 28px rgba(0, 116, 255, .23);

  font-size: 1.55rem !important;
  line-height: 1 !important;

  flex-shrink: 0;

  transition:
    transform .35s cubic-bezier(.22, 1, .36, 1),
    box-shadow .35s ease;
}

/* Second card icon */
#tnPostModal .pm-option:nth-child(2) .pm-icon {
  background: linear-gradient(135deg, #0067ff, #13cde5);
}

/* Actual icon inside the box */
#tnPostModal .pm-icon i {
  display: block !important;

  width: auto !important;
  height: auto !important;

  margin: 0 !important;
  padding: 0 !important;

  color: #fff !important;

  font-size: 1.55rem !important;
  line-height: 1 !important;

  flex-shrink: 0;

  transform: none;
}

/* Icon movement when the card is hovered */
#tnPostModal .pm-option:hover .pm-icon {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(0, 116, 255, .30);
}
#tnPostModal .pm-option strong{display:block;margin-bottom:7px;font-size:1rem;line-height:1.3}
#tnPostModal .pm-option > span:not(.pm-icon):not(.pm-arrow) {
  display: block;
  color: var(--pm-text-soft);
  font-size: .76rem;
  line-height: 1.55;
}
#tnPostModal .pm-arrow{margin-top:auto;padding-top:18px;color:var(--pm-primary)!important;font-size:.78rem!important;font-weight:700}
#tnPostModal .pm-option:focus-visible,#tnPostModal .pm-close:focus-visible{outline:3px solid rgba(22,128,255,.28);outline-offset:3px}
@media(max-width:520px){
  #tnPostModal{padding:14px}
  #tnPostModal .pm-panel{padding:22px 16px 18px;border-radius:22px}
  #tnPostModal .pm-options{gap:10px}
  #tnPostModal .pm-option{min-height:205px;padding:17px 14px 15px;border-radius:17px}
  #tnPostModal .pm-icon {
  width: 48px;
  height: 48px;
  min-width: 48px;
  min-height: 48px;

  margin-bottom: 18px;

  border-radius: 14px;

  font-size: 1.3rem !important;
}

#tnPostModal .pm-icon i {
  font-size: 1.3rem !important;
}
  #tnPostModal .pm-option strong{font-size:.88rem}
  #tnPostModal .pm-option span{font-size:.68rem}
  #tnPostModal .pm-arrow{padding-top:12px;font-size:.68rem!important}
}
@media(max-width:360px){
  #tnPostModal .pm-option{min-height:195px;padding:15px 11px}
  #tnPostModal .pm-option span{font-size:.64rem}
}
@media(prefers-reduced-motion:reduce){
  #tnPostModal,#tnPostModal *{transition-duration:.01ms!important}
}
</style>

<div id="tnPostModal" aria-hidden="true">
  <div class="pm-backdrop" data-post-modal-close></div>
  <section class="pm-panel" role="dialog" aria-modal="true" aria-labelledby="tnPostModalTitle">
    <button type="button" class="pm-close" aria-label="Close post options" data-post-modal-close>×</button>

    <div class="pm-header">
      <h2 id="tnPostModalTitle">What would you like to post?</h2>
      <p>Choose an option below to continue.</p>
    </div>

    <div class="pm-options">
      <a class="pm-option" href="post-advertisement.html" aria-label="Post an advertisement">
        <span class="pm-icon" aria-hidden="true"><i class="bx bx-megaphone"></i></span>
        <strong>Post Ad</strong>
        <span>Post a business ad or submit a banner for publicity and guaranteed views.</span>
        <span class="pm-arrow">Continue <i class="bx bx-right-arrow-alt"></i></span>
      </a>

      <a class="pm-option" href="post-task.html" aria-label="Post a task">
        <span class="pm-icon" aria-hidden="true"><i class="bx bx-task"></i></span>
        <strong>Post Task</strong>
        <span>Create a simple online or social task that users can complete within minutes.</span>
        <span class="pm-arrow">Continue <i class="bx bx-right-arrow-alt"></i></span>
      </a>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";
  const modal=document.getElementById("tnPostModal");
  if(!modal)return;
  let lastFocused=null;

  function openModal(){
    lastFocused=document.activeElement;
    modal.classList.add("pm-open");
    modal.setAttribute("aria-hidden","false");
    document.body.classList.add("post-modal-open");
    requestAnimationFrame(()=>modal.querySelector(".pm-close")?.focus());
  }

  function closeModal(){
    modal.classList.remove("pm-open");
    modal.setAttribute("aria-hidden","true");
    document.body.classList.remove("post-modal-open");
    if(lastFocused&&typeof lastFocused.focus==="function")setTimeout(()=>lastFocused.focus(),10);
  }

  document.addEventListener("tasknova:open-post-modal",openModal);
  modal.querySelectorAll("[data-post-modal-close]").forEach(el=>el.addEventListener("click",closeModal));
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&modal.classList.contains("pm-open"))closeModal();
  });

  if(!document.getElementById("tnPostModalBodyStyle")){
    const s=document.createElement("style");
    s.id="tnPostModalBodyStyle";
    s.textContent="body.post-modal-open{overflow:hidden!important}";
    document.head.appendChild(s);
  }

  window.TaskNovaPostModal={open:openModal,close:closeModal};
})();
</script>
